<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WGPU Life 20000 x 20000</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #020305;
      color: #dce4eb;
    }

    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #app { position: relative; background: #020305; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }
    canvas.waiting { visibility: hidden; }

    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 0.8rem;
      padding: 2rem;
      text-align: center;
      background: #020305;
      z-index: 3;
    }

    #loading[hidden] { display: none; }

    #loading-title {
      color: #8fbeff;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
    }

    #loading-detail {
      max-width: 52rem;
      color: #aab6c0;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    #hud {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      max-width: calc(100% - 1.5rem);
      padding: 0.55rem 0.7rem;
      border: 1px solid #263747;
      border-radius: 0.35rem;
      background: rgb(3 8 12 / 82%);
      color: #cbd6de;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      user-select: none;
    }

    #stats { color: #e3eaf0; }
    #message { color: #91bfff; }

    #controls {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem;
    }

    button {
      border: 1px solid #35506a;
      border-radius: 0.3rem;
      padding: 0.4rem 0.65rem;
      background: rgb(7 17 25 / 88%);
      color: #d7e1e8;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #10283b; }
    button:focus-visible { outline: 2px solid #559cff; outline-offset: 2px; }

    @media (max-width: 700px) {
      #help { display: none; }
      #controls { left: 0.75rem; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="life" class="waiting" aria-label="Conway's Game of Life"></canvas>

    <section id="loading" role="status" aria-live="polite">
      <div id="loading-title">WebGPUを初期化しています</div>
      <div id="loading-detail">shader.wgslと時計スナップショットを読み込みます。</div>
    </section>

    <aside id="hud" hidden>
      <div id="stats"></div>
      <div id="message"></div>
      <div id="help">Wheel: zoom / Drag: pan / Space: pause / Right: step / Up・Down: speed / F: full / R: reset / Esc: stop</div>
    </aside>

    <nav id="controls" aria-label="Life controls" hidden>
      <button id="pause" type="button">Pause</button>
      <button id="step" type="button">Step</button>
      <button id="full" type="button">Full view</button>
      <button id="reset" type="button">Reset</button>
    </nav>
  </main>

  <script type="module" src="test_chrome.js"></script>
</body>
</html>
